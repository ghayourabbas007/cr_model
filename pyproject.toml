[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forecaster"
version = "0.1.0"
description = "Read-only, probabilistic crypto price forecasting for Binance spot markets."
requires-python = ">=3.11"

[project.scripts]
forecaster = "forecaster.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
filterwarnings = [
    # Third-party deprecation inside fastapi.testclient; not actionable here.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = ["live: hits real Binance public endpoints (opt-in: FORECASTER_LIVE_TESTS=1)"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = [
    "PLR0913",  # many keyword args are normal for configuration-heavy constructors
    "PLR2004",  # magic values are fine in tests and thresholds
    "PLR0912", "PLR0915", "PLR0911",  # branch/statement counts: CLI tables and state machines
    "PLC0415",  # deliberate lazy imports keep torch/lightgbm/streamlit optional at import time
    "RUF001", "RUF002", "RUF003",  # intentional unicode (σ, ×, –) in labels and docs
    "B008",     # typer.Option(...) in defaults is the Typer idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "B017"]
